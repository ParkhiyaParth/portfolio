[pytest]
# Pytest configuration for backend integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = .

# Markers
markers =
    integration: Integration tests for API endpoints
    validation: Tests for input validation
    error: Tests for error handling scenarios

# Coverage options (when using pytest-cov)
[coverage:run]
source = .
omit = 
    test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
